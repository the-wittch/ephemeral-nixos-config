name: Bug report
description: Something doesn't work on an installed machine
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: ephemeral-report
      description: Paste the output of `ephemeral-report`. Read it first and remove anything you'd rather not share.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Your own changes
      description: Anything in /persist/etc/nixos/modules/ that might be involved. Leave out secrets.
