name: release tag

on:
  push:
    branches: [main]

permissions: {}

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag=$(head -n 1 <<<"$MESSAGE" | sed -nE 's/^release (v[0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$/\1/p')
          [[ -n $tag ]] || { echo "not a release commit"; exit 0; }
          # a PR's title is the merge's message, and anyone can open one; only the release branch counts
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // empty')
          [[ $head == "release/$tag" ]] || { echo "::warning::$tag not tagged: the commit came from '${head:-a push}', not release/$tag"; exit 0; }
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes
