name: patch release

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: check FLAKE_UPDATE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --silent || {
            echo "::error::FLAKE_UPDATE_TOKEN is missing or expired. Make a new one with contents and pull request write access to this repo."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PRs pushed with the default token don't trigger CI
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: update inputs and open the release PR
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v*.*.*')
          IFS=. read -r major minor patch <<<"${last#v}"
          next="v$major.$minor.$((patch + 1))"
          if git ls-remote --exit-code origin "refs/heads/release/$next" >/dev/null; then
            echo "release/$next is already open"
            exit 0
          fi

          nix flake update
          # stylix pins gnome-shell to a GNOME release; keep the GitHub mirror on the same one
          stylix=$(nix flake metadata --json | jq -r '.locks.nodes.stylix.locked | "github:\(.owner)/\(.repo)/\(.rev)"')
          src=$(nix flake prefetch --json "$stylix" | jq -r .storePath)
          ref=$(sed -nE 's#.*"gitlab:GNOME/gnome-shell/([0-9][0-9.]*)[?"].*#\1#p' "$src/flake.nix" | head -n 1)
          [[ -n $ref ]] || { echo "can't read stylix's gnome-shell version"; exit 1; }
          sed -i -E "s#(github:GNOME/gnome-shell/)[0-9][0-9.]*\"#\1$ref\"#" flake.nix
          nix flake lock
          if git diff --quiet flake.lock; then
            echo "no input changed since $last"
            exit 0
          fi

          sed -i -E "s#(ephemeral-nixos-config/)v[0-9]+\.[0-9]+\.[0-9]+\"#\1$next\"#" README.md
          jq -n --arg tag "$last" --arg rev "$(git rev-list -n 1 "$last")" '{tag: $tag, rev: $rev}' \
            >tests/upgrade/previous.json
          .github/changelog-add.sh CHANGELOG.md "${next#v}" "- nixpkgs and the other inputs updated to $(date -u +%Y-%m-%d)."

          git switch -c "release/$next"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "release $next"
          git push origin "release/$next"
          gh pr create --base main --head "release/$next" --title "release $next" --label boot-test \
            --body "Monthly input update. Merges itself once CI and the boot tests pass; merging tags $next."
          gh pr merge "release/$next" --squash --auto --delete-branch
