name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# per event kind, so opened and labeled don't cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: secret scan
        run: |
          ./scripts/check-no-secrets.sh
          ./scripts/check-no-secrets.sh --range HEAD
      # the weekly release picks its version when it starts, so another release can overtake it
      - name: a release is newer than the last one
        if: startsWith(github.head_ref, 'release/v')
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          next=${HEAD_REF#release/}
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [[ $next == "$last" || $(printf '%s\n%s\n' "$last" "$next" | sort -V | tail -n 1) != "$next" ]]; then
            echo "::error::$next isn't newer than $last, the latest release. Close this and let the next weekly run open one."
            exit 1
          fi
      - name: what changed
        id: changes
        run: ./.github/changed.sh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        if: steps.changes.outputs.code == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: workflow lint
        if: steps.changes.outputs.code == 'true'
        run: |
          nix run --inputs-from path:. nixpkgs#actionlint
          nix run --inputs-from path:. nixpkgs#zizmor -- --offline .github/workflows/
      - name: shellcheck
        if: steps.changes.outputs.code == 'true'
        run: nix run --inputs-from path:. nixpkgs#shellcheck -- -x -P SCRIPTDIR scripts/*.sh scripts/lib/*.sh .github/*.sh .githooks/* flake/tests/_scripts.sh
      - name: shfmt
        if: steps.changes.outputs.code == 'true'
        run: nix run --inputs-from path:. nixpkgs#shfmt -- -i 2 -ci -d scripts .github/*.sh .githooks/* flake/tests/_scripts.sh
      - name: nixfmt
        if: steps.changes.outputs.code == 'true'
        run: git ls-files -z '*.nix' | xargs -0 nix run --inputs-from path:. nixpkgs#nixfmt -- --check
      - name: example settings
        if: steps.changes.outputs.code == 'true'
        run: |
          cp settings.example.json settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix
      - name: flake check
        if: steps.changes.outputs.code == 'true'
        run: .github/eval-checks.sh
      # the installer pins a release of this repo; a change that would break it shows here, not on Tuesday
      - name: installer still evaluates
        if: steps.changes.outputs.code == 'true'
        run: |
          git clone -q --depth 1 https://github.com/the-wittch/ephemeral-nixos.git "$RUNNER_TEMP/installer"
          cd "$RUNNER_TEMP/installer"
          printf '{"username": "alice"}\n' >settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix
          for attr in checks.x86_64-linux.install checks.x86_64-linux.iso-eval packages.x86_64-linux.installer; do
            nix eval --raw "path:$PWD#$attr.drvPath" --override-input ephemeral "path:$GITHUB_WORKSPACE" >/dev/null
          done

  # Skipped counts as passed, so these can be required checks that only cost time on a release PR,
  # a PR given the boot-test label, or a manual run. Not on opened: a label given at creation also
  # fires labeled. They start at once rather than after check, so a labeled run shows them pending
  # straight away and the PR can't merge on the opened run's skipped results.
  boot-test:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action != 'opened' && contains(github.event.pull_request.labels.*.name, 'boot-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: what changed
        id: changes
        run: ./.github/changed.sh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
      - name: free disk space
        if: steps.changes.outputs.code == 'true'
        run: sudo sh -c "rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost &" &
      - name: enable kvm
        if: steps.changes.outputs.code == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        if: steps.changes.outputs.code == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: example settings
        if: steps.changes.outputs.code == 'true'
        run: |
          cp settings.example.json settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix
      - name: boot
        if: steps.changes.outputs.code == 'true'
        # one at a time, so only one test's evaluation is in memory
        run: |
          for check in boot boot-minimal upgrade; do
            nix build "path:.#checks.x86_64-linux.$check" -L --no-link
          done
      # on its own: a fourth VM at the same time slows the others past their timeouts
      - name: disk
        if: steps.changes.outputs.code == 'true'
        run: nix build path:.#checks.x86_64-linux.disk -L --no-link
      - name: update from the previous release's systemd-boot to Limine
        if: steps.changes.outputs.code == 'true'
        run: nix build path:.#checks.x86_64-linux.bootloader-switch -L --no-link
      - name: turn Secure Boot on after updating from the previous release
        if: steps.changes.outputs.code == 'true'
        run: nix build path:.#checks.x86_64-linux.secure-boot -L --no-link

  # The boot tests only build GNOME. This builds every desktop and most feature hosts, so a config
  # that fails to build (Umbriel's and Noctalia's are checked when built) or a package nixpkgs broke
  # is caught before the weekly release merges itself. One desktop at a time, so the runner's disk
  # only has to hold one desktop's packages.
  desktop-build:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action != 'opened' && contains(github.event.pull_request.labels.*.name, 'boot-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: what changed
        id: changes
        run: ./.github/changed.sh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
      - name: free disk space
        if: steps.changes.outputs.code == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        if: steps.changes.outputs.code == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: example settings
        if: steps.changes.outputs.code == 'true'
        run: |
          cp settings.example.json settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix
      - name: build each desktop
        if: steps.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          for group in "gnome-full gnome-minimal feat-network" "plasma-full plasma-minimal feat-pass" \
            "niri-full niri-minimal feat-laptop" "umbriel-full umbriel-minimal"; do
            attrs=()
            for host in $group; do
              attrs+=("path:.#nixosConfigurations.$host.config.system.build.toplevel")
            done
            echo "::group::$group"
            nix build --no-link -L "${attrs[@]}"
            echo "::endgroup::"
            nix-collect-garbage >/dev/null
          done

  # beside boot-test, so the PR doesn't wait longer: the desktops GNOME's test doesn't cover, and
  # this code booted on a /persist the previous release wrote
  more-boot-tests:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action != 'opened' && contains(github.event.pull_request.labels.*.name, 'boot-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: what changed
        id: changes
        run: ./.github/changed.sh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
      - name: free disk space
        if: steps.changes.outputs.code == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
      - name: enable kvm
        if: steps.changes.outputs.code == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        if: steps.changes.outputs.code == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: example settings
        if: steps.changes.outputs.code == 'true'
        run: |
          cp settings.example.json settings.json
          cp hardware-configuration.example.nix hardware-configuration.nix
      - name: desktops
        if: steps.changes.outputs.code == 'true'
        run: |
          for desktop in plasma niri umbriel; do
            nix build "path:.#checks.x86_64-linux.desktop-boot-$desktop" -L --no-link
          done
      - name: boot this code on the previous release's /persist
        if: steps.changes.outputs.code == 'true'
        run: nix build path:.#checks.x86_64-linux.upgrade-boot -L --no-link
      - name: switch from the small install to the full system and back
        if: steps.changes.outputs.code == 'true'
        run: nix build path:.#checks.x86_64-linux.profile-switch -L --no-link
      - name: OpenSnitch against a second machine
        if: steps.changes.outputs.code == 'true'
        run: nix build path:.#checks.x86_64-linux.network-filter -L --no-link
